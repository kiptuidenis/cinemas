name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # --------------------------------------------------------------------------
  # 1. Code Quality, Turnstile & Pre-Commit Hooks
  # --------------------------------------------------------------------------
  quality-gate:
    name: Code Quality & Pre-Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Pre-commit Environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements/dev.txt
          cd frontend && npm ci

      - name: Run Pre-Commit Hooks (Ruff, Gitleaks, ESLint, Prettier)
        run: pre-commit run --all-files

  # --------------------------------------------------------------------------
  # 2. Backend Test & Static Typecheck (Postgres 16 + Redis 7)
  # --------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python 3.14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinema_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/cinema_test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      DJANGO_SETTINGS_MODULE: config.settings.dev
      PYTHONPATH: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install Backend Dependencies
        run: pip install -r backend/requirements/dev.txt

      - name: Run Django System Checks
        run: python backend/manage.py check

      - name: Run Mypy Static Type Checking
        run: |
          cd backend
          mypy apps config

      - name: Run Pytest with Coverage
        run: |
          cd backend
          pytest --cov=apps --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Authoritative Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  # --------------------------------------------------------------------------
  # 3. Frontend Test & Build (Node 24)
  # --------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run TypeScript Type Check
        run: cd frontend && npm run typecheck

      - name: Run Vitest Unit Tests
        run: cd frontend && npm run test:run

      - name: Run Production Vite Build
        run: cd frontend && npm run build

  # --------------------------------------------------------------------------
  # 4. Minimum Supported Python Smoke Check (Python 3.12)
  # --------------------------------------------------------------------------
  python-compatibility-smoke:
    name: Python 3.12 Compatibility Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Verify Requirements Installation on Python 3.12
        run: pip install -r backend/requirements/dev.txt
